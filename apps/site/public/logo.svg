<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Field rings: a body at center with the field radiating out as two opposing
       arcs. Built to stay legible at 16px. Accent #4da3ff; lighter arc #7cc7de. -->
  <circle cx="50" cy="50" r="12" fill="#4da3ff"/>
  <path d="M50 14 A36 36 0 0 1 86 50" fill="none" stroke="#4da3ff" stroke-width="9" stroke-linecap="round"/>
  <path d="M50 86 A36 36 0 0 1 14 50" fill="none" stroke="#7cc7de" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
</svg>
