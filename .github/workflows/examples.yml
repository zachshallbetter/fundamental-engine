# Consumer proof: build every bundler example in examples/ against the PUBLISHED
# @fundamental-engine/* packages (the versions in each example's package.json), exactly as a
# downstream user would. This is the half of post-publish verification that proves the packages
# work in real framework projects — not just that they install. Static (no-bundler) examples
# (vanilla-cdn, single-file, web-component) are plain HTML and aren't built here.
#
# SSR examples (nextjs, astro, sveltekit, nuxt) use framework-specific build commands but the
# same install/build/smoke pattern — they prove the SSR integration patterns are copy-pasteable.
name: examples

on:
  pull_request:
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build vanilla-vite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install (from the published packages)
        run: npm ci
        working-directory: examples/vanilla-vite
      - name: build
        run: npm run build
        working-directory: examples/vanilla-vite
      # Boot smoke: serve dist + assert a live field (particleCount() > 0). Playwright is added
      # only in CI (kept out of the example's own deps so its package.json stays copy-pasteable).
      - name: boot smoke
        if: hashFiles('examples/vanilla-vite/smoke.mjs') != ''
        working-directory: examples/vanilla-vite
        run: |
          npm i --no-save @playwright/test
          npx playwright install --with-deps chromium
          node smoke.mjs
